services:
  - type: web
    name: meeting-intelligence-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m app.seed.seed && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: meeting-intelligence-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/app.db
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: FRONTEND_URL
        value: https://meeting-intelligence-web.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_BYTES
        value: "2097152"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

  - type: web
    name: meeting-intelligence-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build && mkdir -p .next/standalone/.next/static && cp -r .next/static/. .next/standalone/.next/static/ && cp -r public .next/standalone/public
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_API_URL
        value: https://meeting-intelligence-api.onrender.com/api/v1
      - key: HOSTNAME
        value: 0.0.0.0
